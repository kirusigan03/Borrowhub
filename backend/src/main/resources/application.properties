spring.application.name=backend

server.port=8080

# --- MySQL ---
# Create the database first: CREATE DATABASE borrowhub;
spring.datasource.url=jdbc:mysql://localhost:3306/borrowhub?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=Kiru@2003
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
# update = auto-creates/updates tables from your @Entity classes as you add them.
# Fine for development; swap for a migration tool (Flyway/Liquibase) before production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

